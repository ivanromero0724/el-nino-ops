name: Generar mapa SitRep

on:
  workflow_dispatch:
  push:
    paths:
      - "data/base_maestra_elnino.csv"
      - "scripts/mapa_sitrep.py"
      - "scripts/preparar_geografia.py"
      - "assets/ops_oms.png"
      - "assets/logo_payload_final/**"
      - "requirements.txt"
      - ".github/workflows/generar_mapa.yml"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconstruir y validar logo OPS/OMS
        run: |
          base64 --decode assets/logo_payload_final/logo.b64 > assets/ops_oms.png
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from PIL import Image

          p = Path("assets/ops_oms.png")
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          esperado = "a9e2685bf6ae716326b8ca8c698d2080ea2d51d47a49690cf4099bb46c4c8061"
          if digest != esperado:
              raise RuntimeError(f"SHA256 inesperado para el logo: {digest}")

          im = Image.open(p)
          im.verify()
          im = Image.open(p)
          print("Logo válido:", p, im.size, im.mode, digest)
          PY

      - name: Ajustar estilo visual del mapa
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("scripts/mapa_sitrep.py")
          txt = p.read_text(encoding="utf-8")

          # Océano azul OPS claro.
          txt = txt.replace('AZUL_MAR = "#E5F6FB"', 'AZUL_MAR = "#D9EEF7"')

          # El área cartográfica ocupa toda la altura de la página.
          txt = txt.replace(
              'ax=fig.add_axes([.020,.035,.620,.930])',
              'ax=fig.add_axes([.020,0,.620,1.0])'
          )

          # Un poco más de zoom sobre México, Centroamérica, Caribe y Sudamérica.
          # Se deja solo una franja de EEUU como contexto y prácticamente nada de Canadá.
          extensiones_previas = [
              'ax.set_facecolor(AZUL_MAR); ax.set_xlim(-124,-30); ax.set_ylim(-58,32); ax.set_aspect("equal",adjustable="box")',
              'ax.set_facecolor(AZUL_MAR); ax.set_xlim(-124,-30); ax.set_ylim(-58,36); ax.set_aspect("equal",adjustable="box")',
              'ax.set_facecolor(AZUL_MAR); ax.set_xlim(-130,-22); ax.set_ylim(-58,56); ax.set_aspect("equal",adjustable="box")',
              'ax.set_facecolor(AZUL_MAR); ax.set_xlim(-124,-27.5); ax.set_ylim(-58,44); ax.set_aspect("equal",adjustable="box")',
          ]
          for old in extensiones_previas:
              txt = txt.replace(
                  old,
                  'ax.set_facecolor(AZUL_MAR); ax.set_xlim(-123,-30); ax.set_ylim(-58,40); ax.set_aspect("equal",adjustable="box")'
              )

          rectangulos_previos = [
              'Rectangle((-124,-58),94,90,',
              'Rectangle((-124,-58),94,94,',
              'Rectangle((-130,-58),108,114,',
              'Rectangle((-124,-58),96.5,102,',
          ]
          for old in rectangulos_previos:
              txt = txt.replace(old, 'Rectangle((-123,-58),93,98,')

          # Fondo azul detrás de toda la columna del mapa.
          fondo_columna = '    fig.add_artist(Rectangle((.020,0),.620,1.0,transform=fig.transFigure,facecolor=AZUL_MAR,edgecolor="none",zorder=-10,clip_on=False))'
          if fondo_columna not in txt:
              txt = txt.replace(
                  '    fig=plt.figure(figsize=(13,8.5),facecolor="white")\n',
                  '    fig=plt.figure(figsize=(13,8.5),facecolor="white")\n' + fondo_columna + '\n'
              )

          # Sin padding externo para evitar franjas blancas.
          txt = txt.replace('pad_inches=.03', 'pad_inches=0')

          # Logo OPS/OMS grande.
          txt = txt.replace(
              'ax_logo=fig.add_axes([.735,.035,.165,.135])',
              'ax_logo=fig.add_axes([.650,.005,.340,.220])'
          )
          txt = txt.replace(
              'ax_logo=fig.add_axes([.680,.010,.300,.195])',
              'ax_logo=fig.add_axes([.650,.005,.340,.220])'
          )
          txt = txt.replace('OffsetImage(logo,zoom=.145)', 'OffsetImage(logo,zoom=.50)')
          txt = txt.replace('OffsetImage(logo,zoom=.32)', 'OffsetImage(logo,zoom=.50)')

          p.write_text(txt, encoding="utf-8")
          print("Estilo actualizado: zoom adicional y menor presencia de EEUU/Canadá")
          PY

      - name: Preparar geografía
        run: python scripts/preparar_geografia.py

      - name: Generar mapa
        run: python scripts/mapa_sitrep.py

      - name: Guardar GeoPackage, logo, código y mapas en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geografia/paises_americas.gpkg assets/ops_oms.png scripts/mapa_sitrep.py outputs/mapas/
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Aumentar un poco más el zoom del mapa"
            git push
          fi