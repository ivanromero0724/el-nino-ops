name: Generar mapa SitRep

on:
  workflow_dispatch:
  push:
    paths:
      - "data/base_maestra_elnino.csv"
      - "scripts/mapa_sitrep.py"
      - "scripts/preparar_geografia.py"
      - "assets/ops_oms.png"
      - "assets/logo_payload_final/**"
      - "requirements.txt"
      - ".github/workflows/generar_mapa.yml"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconstruir y validar logo OPS/OMS
        run: |
          base64 --decode assets/logo_payload_final/logo.b64 > assets/ops_oms.png
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from PIL import Image

          p = Path("assets/ops_oms.png")
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          esperado = "a9e2685bf6ae716326b8ca8c698d2080ea2d51d47a49690cf4099bb46c4c8061"
          if digest != esperado:
              raise RuntimeError(f"SHA256 inesperado para el logo: {digest}")

          im = Image.open(p)
          im.verify()
          im = Image.open(p)
          print("Logo válido:", p, im.size, im.mode, digest)
          PY

      - name: Ajustar estilo visual del mapa
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("scripts/mapa_sitrep.py")
          txt = p.read_text(encoding="utf-8")

          # Océano claramente azul y visible aun con los ejes ocultos.
          txt = txt.replace('AZUL_MAR = "#E5F6FB"', 'AZUL_MAR = "#D9EEF7"')
          if 'ax.add_patch(Rectangle((-124,-58),94,90' not in txt:
              txt = txt.replace(
                  '    ax.set_facecolor(AZUL_MAR); ax.set_xlim(-124,-30); ax.set_ylim(-58,32); ax.set_aspect("equal",adjustable="box")',
                  '    ax.set_facecolor(AZUL_MAR); ax.set_xlim(-124,-30); ax.set_ylim(-58,32); ax.set_aspect("equal",adjustable="box")\n    ax.add_patch(Rectangle((-124,-58),94,90,facecolor=AZUL_MAR,edgecolor="none",zorder=0))'
              )

          # Logo OPS/OMS más grande y con mayor área disponible.
          txt = txt.replace(
              'ax_logo=fig.add_axes([.735,.035,.165,.135])',
              'ax_logo=fig.add_axes([.680,.010,.300,.195])'
          )
          txt = txt.replace('OffsetImage(logo,zoom=.145)', 'OffsetImage(logo,zoom=.32)')

          p.write_text(txt, encoding="utf-8")
          print("Estilo actualizado: océano azul + logo OPS/OMS ampliado")
          PY

      - name: Preparar geografía
        run: python scripts/preparar_geografia.py

      - name: Generar mapa
        run: python scripts/mapa_sitrep.py

      - name: Guardar GeoPackage, logo, código y mapas en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geografia/paises_americas.gpkg assets/ops_oms.png scripts/mapa_sitrep.py outputs/mapas/
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Ajustar océano azul y tamaño del logo OPS/OMS"
            git push
          fi
