name: Generar mapa SitRep

on:
  workflow_dispatch:
  push:
    paths:
      - "data/base_maestra_elnino.csv"
      - "scripts/mapa_sitrep.py"
      - "scripts/preparar_geografia.py"
      - "assets/ops_oms.png"
      - "requirements.txt"
      - ".github/workflows/generar_mapa.yml"

permissions:
  contents: write

concurrency:
  group: generar-mapa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar geografía
        run: python scripts/preparar_geografia.py

      - name: Generar mapa
        run: python scripts/mapa_sitrep.py

      - name: Validar productos
        run: |
          python - <<'PY'
          from pathlib import Path

          geo = Path("data/geografia/paises_americas.gpkg")
          out = Path("outputs/mapas")
          pngs = list(out.glob("Mapa_prioridades_amenazas_salud_El_Nino_OPS_SitRep*.png"))
          pdfs = list(out.glob("Mapa_prioridades_amenazas_salud_El_Nino_OPS_SitRep*.pdf"))
          revisiones = list(out.glob("*_rev*.png"))

          assert geo.exists() and geo.stat().st_size > 0, "GeoPackage no generado"
          assert pngs, "No se generó PNG"
          assert pdfs, "No se generó PDF"
          assert not revisiones, f"No deben existir copias revXX: {revisiones}"
          print("OK:", geo, pngs[-1], pdfs[-1])
          PY

      - name: Guardar productos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geografia/paises_americas.gpkg outputs/mapas/
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi
          git commit -m "Actualizar productos del SitRep"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
