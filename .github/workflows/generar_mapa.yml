name: Generar mapa SitRep

on:
  workflow_dispatch:
  push:
    paths:
      - "data/base_maestra_elnino.csv"
      - "data/geografia/paises_americas.gpkg"
      - "scripts/mapa_sitrep.py"
      - "assets/ops_oms.png"
      - "assets/PAHO_eng.png"
      - "requirements.txt"
      - ".github/workflows/generar_mapa.yml"

permissions:
  contents: write

concurrency:
  group: generar-mapa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Descargar y versionar el logo institucional inglés solo cuando aún
      # no exista en el repositorio. Una vez guardado, no depende de la URL.
      - name: Preparar logo PAHO inglés
        run: |
          if [ ! -s assets/PAHO_eng.png ]; then
            curl --fail --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 120 \
              "https://roadsafetyfund.un.org/sites/default/files/images/partnerlogos/2024-09/pahobrand-blue-stacked-2024-en.png" \
              --output assets/PAHO_eng.png
          fi
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          path = Path("assets/PAHO_eng.png")
          with Image.open(path) as logo:
              assert logo.format == "PNG", "Logo inglés no es PNG"
              assert logo.width >= 500 and logo.height >= 200, "Logo inglés demasiado pequeño"
              logo.verify()
          print("Logo PAHO inglés válido:", path.stat().st_size, "bytes")
          PY

      - name: Generar mapas en español e inglés
        run: |
          python scripts/mapa_sitrep.py --lang es
          python scripts/mapa_sitrep.py --lang en

      - name: Validar cuatro productos bilingües
        run: |
          python - <<'PY'
          from pathlib import Path

          from PIL import Image
          from scripts.mapa_sitrep import cargar_sitrep

          geo = Path("data/geografia/paises_americas.gpkg")
          out = Path("outputs/mapas")
          assert geo.exists() and geo.stat().st_size > 0, "GeoPackage ausente"

          seleccion, _, _ = cargar_sitrep()
          numero = int(seleccion["sitrep_numero"].max())
          fecha = seleccion["fecha_publicacion"].max().strftime("%Y-%m-%d")
          nombre = f"Mapa_prioridades_amenazas_salud_El_Nino_OPS_SitRep{numero:02d}_{fecha}"

          for sufijo in ("", "_EN"):
              png = out / f"{nombre}{sufijo}.png"
              pdf = out / f"{nombre}{sufijo}.pdf"
              for archivo in (png, pdf):
                  assert archivo.is_file() and archivo.stat().st_size > 1000, (
                      f"Falta el producto del SitRep actual: {archivo}"
                  )
              with Image.open(png) as im:
                  im.verify()
              with pdf.open("rb") as f:
                  assert f.read(5) == b"%PDF-", f"PDF inválido: {pdf}"
              print("Productos válidos:", png.name, pdf.name)

          revisiones = list(out.glob("*_rev*.png"))
          assert not revisiones, f"No deben existir copias revXX: {revisiones}"
          PY

      - name: Guardar productos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/mapas/ assets/PAHO_eng.png
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi
          git commit -m "Actualizar productos del SitRep"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
