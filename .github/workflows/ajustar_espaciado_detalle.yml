name: Ajustar espaciado detalle por país

on:
  push:
    paths:
      - ".github/workflows/ajustar_espaciado_detalle.yml"

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Separar filas de tarjetas de detalle
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app.py")
          txt = p.read_text(encoding="utf-8")
          needle = "            box-shadow:0 2px 9px rgba(0,75,135,.035);\n"
          addition = needle + "            margin-bottom:.85rem;\n"
          if "margin-bottom:.85rem;" not in txt:
              if needle not in txt:
                  raise RuntimeError("No se encontró la regla de sombra de detail-card")
              txt = txt.replace(needle, addition, 1)
              p.write_text(txt, encoding="utf-8")
          PY

      - name: Guardar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Separar tarjetas de detalle por país"
            git push
          fi
