name: Aplicar mapa interactivo con iconos SitRep

on:
  push:
    paths:
      - "scripts/patch_dashboard_mapa_interactivo.py"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajuste interactivo
        run: python scripts/patch_dashboard_mapa_interactivo.py

      - name: Validar sintaxis
        run: python -m py_compile app.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Restaurar mapa interactivo con iconos vectoriales SitRep"
          git pull --rebase origin main
          git push
