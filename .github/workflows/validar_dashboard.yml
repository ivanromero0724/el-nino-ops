name: Validar dashboard

# Validación automática del dashboard, dependencias, geografía y capas cartográficas.
on:
  workflow_dispatch:
  push:
    paths:
      - "app.py"
      - ".streamlit/**"
      - "requirements.txt"
      - "data/base_maestra_elnino.csv"
      - "data/geografia/paises_americas.gpkg"
      - "assets/ops_oms.png"
      - ".github/workflows/validar_dashboard.yml"

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis
        run: python -m py_compile app.py

      - name: Validar carga del dashboard
        run: python -c "import app"
