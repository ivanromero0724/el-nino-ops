name: Validar dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - "app.py"
      - "dashboard.py"
      - ".streamlit/**"
      - "requirements.txt"
      - "data/base_maestra_elnino.csv"
      - "data/geografia/paises_americas.gpkg"
      - "assets/ops_oms.png"
      - "scripts/mapa_sitrep.py"
      - ".github/workflows/validar_dashboard.yml"

permissions:
  contents: read

concurrency:
  group: validar-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis
        run: |
          python -m py_compile app.py dashboard.py

      - name: Validar componentes del mapa
        run: |
          python - <<'PY'
          from pathlib import Path
          txt = Path("app.py").read_text(encoding="utf-8")
          requeridos = [
              "def _construir_folium",
              "folium.GeoJsonTooltip",
              "tooltip=folium.GeoJsonTooltip",
              "zoom_start=3.0",
              "clip_americas = box(-135.0",
              "st.iframe(",
              "height=652",
          ]
          faltan = [x for x in requeridos if x not in txt]
          if faltan:
              raise SystemExit(f"Faltan componentes del mapa: {faltan}")
          print("OK: estructura Folium y hover presentes")
          PY

      - name: Smoke test del mapa real
        env:
          OPS_MAP_SMOKE_TEST: "1"
        run: |
          python - <<'PY'
          import pandas as pd
          import geopandas as gpd
          from shapely.geometry import Polygon
          import app

          geo = gpd.GeoDataFrame(
              {
                  "COUNTRY": ["Mexico"],
                  "ISO_CC": ["MEX"],
              },
              geometry=[Polygon([(-118,14),(-86,14),(-86,33),(-118,33),(-118,14)])],
              crs="EPSG:4326",
          )
          actual = pd.DataFrame([{
              "iso3": "MEX",
              "pais": "México",
              "prioridad": "Alta",
              "situacion_predominante": "Déficit de precipitación e incremento del riesgo de incendios.",
              "icono_agua": 1,
              "icono_inundaciones": 0,
              "icono_incendios": 1,
              "icono_alimentos": 0,
              "icono_arbovirosis": 0,
              "icono_respiratorio": 0,
              "icono_servicios": 0,
          }])
          frame = {
              "geo": geo,
              "actual": actual,
              "filtrado": actual.copy(),
              "hay_filtros": False,
              "amenazas_mapa": list(app.AMENAZAS.keys()),
              "AMENAZAS_CORTAS": {
                  "Sequía / agua": "Sequía",
                  "Inundaciones / lluvias": "Inundaciones",
                  "Incendios / quemadas": "Incendios",
                  "Inseguridad alimentaria": "Inseguridad alimentaria",
                  "Dengue / otras arbovirosis": "Arbovirosis",
                  "Calidad del aire / riesgo respiratorio": "Aire",
                  "Afectación de servicios de salud": "Afectación servicios",
              },
          }

          m = app._construir_folium(frame)
          rendered = m.get_root().render()

          checks = {
              "hover Leaflet": "bindTooltip" in rendered,
              "campo país": "pais_popup" in rendered,
              "campo prioridad": "prioridad_popup" in rendered,
              "campo amenazas": "amenazas_popup" in rendered,
              "situación fuera del popup": "situacion_popup" not in rendered,
              "vista centrada": "zoom_start=3.0" in __import__("pathlib").Path("app.py").read_text(encoding="utf-8"),
              "callout": "#075594" in rendered,
          }
          fallos = [k for k, ok in checks.items() if not ok]
          if fallos:
              raise SystemExit(f"Falló smoke test del mapa: {fallos}")
          print("OK:", checks)
          PY

      - name: Validar visibilidad del mapa según filtros
        env:
          OPS_MAP_SMOKE_TEST: "1"
        run: |
          python - <<'PY'
          import pandas as pd
          import app

          mapa = pd.DataFrame({
              "ISO_CC": ["MEX", "COL", "CAN", "ARG"],
              "iso3": ["MEX", "COL", None, None],
              "prioridad": ["Alta", "Media", None, None],
          })

          # Sin filtros: toda la geografía sigue visible con su prioridad normal.
          r = app._filtrar_geografia_mapa(
              mapa, pd.DataFrame({"iso3": ["MEX", "COL"]}), False, []
          )
          assert set(r["ISO_CC"]) == {"MEX", "COL", "CAN", "ARG"}
          assert dict(zip(r["ISO_CC"], r["prioridad_mapa"])) == {
              "MEX": "Alta",
              "COL": "Media",
              "CAN": "Sin priorización",
              "ARG": "Sin priorización",
          }

          # Con subregión / prioridad / amenaza se conserva el mapa completo:
          # los que cumplen mantienen su prioridad y los demás pasan a
          # "Fuera del filtro" para conservar el contexto geográfico.
          r = app._filtrar_geografia_mapa(
              mapa, pd.DataFrame({"iso3": ["MEX"]}), True, ["Alta"]
          )
          assert set(r["ISO_CC"]) == {"MEX", "COL", "CAN", "ARG"}
          estado = dict(zip(r["ISO_CC"], r["prioridad_mapa"]))
          assert estado["MEX"] == "Alta"
          assert estado["COL"] == "Fuera del filtro"
          assert estado["CAN"] == "Fuera del filtro"
          assert estado["ARG"] == "Fuera del filtro"

          r = app._filtrar_geografia_mapa(
              mapa, pd.DataFrame({"iso3": ["COL"]}), True, []
          )
          estado = dict(zip(r["ISO_CC"], r["prioridad_mapa"]))
          assert estado["COL"] == "Media"
          assert estado["MEX"] == "Fuera del filtro"
          assert estado["CAN"] == "Fuera del filtro"

          # Excepción: al filtrar "Sin priorización", los países que no tienen
          # fila en el SitRep siguen mostrándose como "Sin priorización".
          r = app._filtrar_geografia_mapa(
              mapa, pd.DataFrame({"iso3": ["COL"]}), True, ["Sin priorización"]
          )
          estado = dict(zip(r["ISO_CC"], r["prioridad_mapa"]))
          assert estado["COL"] == "Media"
          assert estado["MEX"] == "Fuera del filtro"
          assert estado["CAN"] == "Sin priorización"
          assert estado["ARG"] == "Sin priorización"

          print("OK: contexto geográfico y colores de filtro del mapa")
          PY

      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: E2E hover en navegador
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          trap "kill $APP_PID || true" EXIT

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8501/_stcore/health

          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1100})
              page.goto("http://127.0.0.1:8501", wait_until="networkidle", timeout=120000)

              # Medir la alineación real a partir del iframe visible del mapa.
              # Se busca el ancestro que realmente dibuja el borde del contenedor.
              try:
                  iframe = page.locator("iframe").first
                  iframe.wait_for(state="attached", timeout=15000)
                  priority_box = page.locator(".priority-card").first.bounding_box()
                  map_box = iframe.evaluate("""el => {
                      let p = el.parentElement;
                      while (p) {
                          const cs = getComputedStyle(p);
                          const bw = Math.max(
                              parseFloat(cs.borderTopWidth) || 0,
                              parseFloat(cs.borderBottomWidth) || 0,
                              parseFloat(cs.borderLeftWidth) || 0,
                              parseFloat(cs.borderRightWidth) || 0
                          );
                          if (bw >= 1) {
                              const r = p.getBoundingClientRect();
                              return {
                                  x:r.x, y:r.y, width:r.width, height:r.height,
                                  bottom:r.bottom, borderWidth:bw,
                                  testid:p.getAttribute("data-testid"),
                                  cls: typeof p.className === "string" ? p.className : ""
                              };
                          }
                          p = p.parentElement;
                      }
                      return null;
                  }""")
                  print("ALIGN_MAP", map_box)
                  print("ALIGN_PRIORITY", priority_box)

                  if not map_box or not priority_box:
                      raise AssertionError(
                          f"No se pudieron medir mapa/leyenda: mapa={map_box}, prioridad={priority_box}"
                      )
                  map_bottom = map_box["bottom"]
                  priority_bottom = priority_box["y"] + priority_box["height"]
                  diferencia = abs(map_bottom - priority_bottom)
                  print("ALIGN_BOTTOM_DIFF", diferencia, map_bottom, priority_bottom)
                  if diferencia > 2:
                      page.screenshot(path="mapa_alineacion_fallo.png", full_page=True)
                      raise AssertionError(
                          f"Mapa y leyenda desalineados por {diferencia:.2f}px "
                          f"(mapa={map_bottom:.2f}, leyenda={priority_bottom:.2f})"
                      )
              except Exception as exc:
                  print("ALIGN_DIAGNOSTIC_ERROR", repr(exc))
                  raise

              # Esperar a que el componente Folium esté montado.
              folium_frame = None
              for _ in range(60):
                  for frame in page.frames:
                      if frame == page.main_frame:
                          continue
                      if frame.locator("path.leaflet-interactive").count() > 0:
                          folium_frame = frame
                          break
                  if folium_frame:
                      break
                  page.wait_for_timeout(1000)

              if folium_frame is None:
                  page.screenshot(path="mapa_hover_fallo.png", full_page=True)
                  raise AssertionError("No se encontró el mapa Leaflet interactivo")

              pais = folium_frame.locator("path.leaflet-interactive").first
              pais.hover(force=True)
              tooltip = folium_frame.locator(".leaflet-tooltip").first
              tooltip.wait_for(state="visible", timeout=10000)
              texto = tooltip.inner_text()

              if "Prioridad" not in texto or "Amenazas / impactos" not in texto:
                  page.screenshot(path="mapa_hover_fallo.png", full_page=True)
                  raise AssertionError(f"Tooltip incompleto: {texto!r}")
              if "Situación" in texto:
                  page.screenshot(path="mapa_hover_fallo.png", full_page=True)
                  raise AssertionError(f"El popup todavía muestra Situación: {texto!r}")

              # Al hacer clic en un país no debe aparecer el rectángulo azul
              # de foco del SVG ni quedar el polígono enfocado.
              pais.click(force=True)
              foco = pais.evaluate("""el => ({
                  outlineStyle: getComputedStyle(el).outlineStyle,
                  outlineWidth: getComputedStyle(el).outlineWidth,
                  boxShadow: getComputedStyle(el).boxShadow,
                  active: document.activeElement === el
              })""")
              if foco["outlineStyle"] != "none" or foco["boxShadow"] not in ("none", ""):
                  page.screenshot(path="mapa_click_fallo.png", full_page=True)
                  raise AssertionError(f"El clic todavía deja foco visual: {foco}")

              # Verificar que el encuadre visible contiene México y el extremo sur
              # de Sudamérica. Se toma la instancia Leaflet creada por Folium.
              bounds = folium_frame.evaluate("""() => {
                  const key = Object.keys(window).find(k => k.startsWith('map_') && window[k] && window[k].getBounds);
                  if (!key) return null;
                  const b = window[key].getBounds();
                  return {
                      south: b.getSouth(), west: b.getWest(),
                      north: b.getNorth(), east: b.getEast()
                  };
              }""")
              if not bounds:
                  raise AssertionError("No se pudieron leer los límites del mapa Leaflet")

              centro = folium_frame.evaluate("""() => {
                  const key = Object.keys(window).find(k => k.startsWith('map_') && window[k] && window[k].getCenter);
                  if (!key) return null;
                  const c = window[key].getCenter();
                  return {lat: c.lat, lng: c.lng};
              }""")
              if not centro or not (-80 <= centro["lng"] <= -72):
                  page.screenshot(path="mapa_centrado_fallo.png", full_page=True)
                  raise AssertionError(f"El mapa no quedó centrado sobre América: {centro}")

              solapes = folium_frame.evaluate("""() => {
                  const els = [...document.querySelectorAll('.ops-callout')];
                  const cajas = els.map(el => {
                      const r = el.getBoundingClientRect();
                      return {iso: el.dataset.iso || '', x:r.x, y:r.y, w:r.width, h:r.height};
                  });
                  const out = [];
                  for (let i=0; i<cajas.length; i++) {
                      for (let j=i+1; j<cajas.length; j++) {
                          const a=cajas[i], b=cajas[j];
                          const ix = Math.max(0, Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x));
                          const iy = Math.max(0, Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
                          if (ix > 2 && iy > 2) out.push({a:a.iso,b:b.iso,ix,iy});
                      }
                  }
                  return out;
              }""")
              if solapes:
                  page.screenshot(path="mapa_solapes_fallo.png", full_page=True)
                  raise AssertionError(f"Callouts superpuestos: {solapes}")
              if not (bounds["south"] <= -55 and bounds["north"] >= 31 and bounds["west"] <= -116 and bounds["east"] >= -36):
                  page.screenshot(path="mapa_hover_fallo.png", full_page=True)
                  raise AssertionError(f"Encuadre incompleto México-Sudamérica: {bounds}")
              centro_live = folium_frame.evaluate("""() => {
                  const key = Object.keys(window).find(k => k.startsWith('map_') && window[k] && window[k].getCenter);
                  if (!key) return null;
                  const c = window[key].getCenter();
                  return {lat: c.lat, lng: c.lng};
              }""")
              if not centro_live or not (-80 <= centro_live["lng"] <= -72):
                  page.screenshot(path="mapa_live_centrado_fallo.png", full_page=True)
                  raise AssertionError(f"La versión live no quedó centrada: {centro_live}")

              solapes_live = folium_frame.evaluate("""() => {
                  const els = [...document.querySelectorAll('.ops-callout')];
                  const cajas = els.map(el => {
                      const r = el.getBoundingClientRect();
                      return {iso: el.dataset.iso || '', x:r.x, y:r.y, w:r.width, h:r.height};
                  });
                  const out = [];
                  for (let i=0; i<cajas.length; i++) {
                      for (let j=i+1; j<cajas.length; j++) {
                          const a=cajas[i], b=cajas[j];
                          const ix = Math.max(0, Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x));
                          const iy = Math.max(0, Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
                          if (ix > 2 && iy > 2) out.push({a:a.iso,b:b.iso,ix,iy});
                      }
                  }
                  return out;
              }""")
              if solapes_live:
                  page.screenshot(path="mapa_live_solapes_fallo.png", full_page=True)
                  raise AssertionError(f"Callouts live superpuestos: {solapes_live}")

              limites_navegacion = folium_frame.evaluate("""() => {
                  const key = Object.keys(window).find(k => k.startsWith('map_') && window[k] && window[k].getBounds);
                  if (!key) return null;
                  const mb = window[key].options.maxBounds;
                  if (!mb) return null;
                  return {
                      south: mb.getSouth(), west: mb.getWest(),
                      north: mb.getNorth(), east: mb.getEast()
                  };
              }""")
              if not limites_navegacion:
                  raise AssertionError("No se pudieron leer los límites de navegación")
              if limites_navegacion["north"] < 80:
                  page.screenshot(path="mapa_hover_fallo.png", full_page=True)
                  raise AssertionError(f"Canadá sigue limitado: {limites_navegacion}")

              # Caso reportado por el usuario: filtrar por América Central.
              multis = page.locator('[data-testid="stMultiSelect"]')
              if multis.count() < 3:
                  raise AssertionError("No se encontraron los filtros multiselect esperados")
              subregion = multis.nth(0)
              entrada_sub = subregion.locator("input")
              entrada_sub.click()
              entrada_sub.fill("América Central")
              page.wait_for_timeout(250)
              entrada_sub.press("Enter")
              page.locator('[data-testid="stFormSubmitButton"]').first.click()
              page.wait_for_timeout(1800)

              titulo = page.get_by_text("El Niño y salud pública en las Américas", exact=True)
              try:
                  titulo.wait_for(state="visible", timeout=15000)
              except Exception:
                  page.screenshot(path="filtro_subregion_fallo.png", full_page=True)
                  try:
                      print("\n===== STREAMLIT LOG =====\n")
                      print(open("/tmp/streamlit.log", encoding="utf-8", errors="replace").read()[-12000:])
                      print("\n===== FIN STREAMLIT LOG =====\n")
                  except Exception as log_exc:
                      print("No se pudo leer streamlit.log:", log_exc)
                  raise
              if page.locator('[data-testid="stAppViewContainer"]').count() == 0:
                  page.screenshot(path="filtro_subregion_fallo.png", full_page=True)
                  print(open("/tmp/streamlit.log", encoding="utf-8", errors="replace").read()[-12000:])
                  raise AssertionError("La app quedó en blanco al filtrar América Central")

              # Verificar que el mapa vuelva a existir tras el filtro de subregión.
              folium_sub_ok = False
              for _ in range(40):
                  for frame in page.frames:
                      if frame == page.main_frame:
                          continue
                      if frame.locator("path.leaflet-interactive").count() > 0:
                          folium_sub_ok = True
                          break
                  if folium_sub_ok:
                      break
                  page.wait_for_timeout(500)
              if not folium_sub_ok:
                  page.screenshot(path="filtro_subregion_fallo.png", full_page=True)
                  raise AssertionError("El mapa no volvió a montarse al filtrar América Central")

              # Limpiar el filtro antes del estrés de prioridad.
              chips = subregion.locator('[data-testid="stMultiSelectDeleteIcon"]')
              if chips.count() > 0:
                  chips.first.click()
                  page.locator('[data-testid="stFormSubmitButton"]').first.click()
                  page.wait_for_timeout(1200)

              print("OK filtro América Central")

              # Estrés de reruns: aplicar varios filtros seguidos y comprobar
              # que la app no quede en blanco durante las reconstrucciones.
              for valor in ["Alta", "Media", "Baja"]:
                  multis = page.locator('[data-testid="stMultiSelect"]')
                  if multis.count() < 3:
                      page.screenshot(path="filtros_rerun_fallo.png", full_page=True)
                      raise AssertionError("No se encontraron los filtros multiselect esperados")
                  prioridad = multis.nth(1)
                  entrada = prioridad.locator("input")
                  entrada.click()
                  entrada.fill(valor)
                  page.wait_for_timeout(250)
                  entrada.press("Enter")
                  page.locator('[data-testid="stFormSubmitButton"]').first.click()
                  page.wait_for_timeout(1200)

                  titulo = page.get_by_text("El Niño y salud pública en las Américas", exact=True)
                  titulo.wait_for(state="visible", timeout=15000)
                  if page.locator('[data-testid="stAppViewContainer"]').count() == 0:
                      page.screenshot(path="filtros_rerun_fallo.png", full_page=True)
                      raise AssertionError(f"La app quedó en blanco al aplicar prioridad {valor}")

              # Después de varios reruns, el mapa debe volver a montarse.
              folium_ok = False
              for _ in range(30):
                  for frame in page.frames:
                      if frame == page.main_frame:
                          continue
                      if frame.locator("path.leaflet-interactive").count() > 0:
                          folium_ok = True
                          break
                  if folium_ok:
                      break
                  page.wait_for_timeout(500)
              if not folium_ok:
                  page.screenshot(path="filtros_rerun_fallo.png", full_page=True)
                  raise AssertionError("El mapa no volvió a montarse después de varios filtros")

              print("OK tooltip navegador:", texto[:300])
              print("OK bounds:", bounds)
              print("OK navegación Canadá:", limites_navegacion)
              print("OK reruns por filtros")
              page.screenshot(path="mapa_hover_ok.png", full_page=True)
              browser.close()
          PY

      - name: E2E exhaustivo de todos los filtros
        run: |
          streamlit run app.py --server.headless true --server.port 8502 > /tmp/streamlit-filtros.log 2>&1 &
          APP_PID=$!
          trap "kill $APP_PID || true" EXIT

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8502/_stcore/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8502/_stcore/health

          python - <<'PY'
          from itertools import product
          from playwright.sync_api import sync_playwright

          SUBREGIONES = [
              "América Central",
              "América del Norte",
              "Brasil y Cono Sur",
              "Caribe",
              "Subregión Andina",
          ]
          PRIORIDADES = ["Alta", "Media", "Baja", "Sin priorización"]
          AMENAZAS = [
              "Sequía / agua",
              "Inundaciones / lluvias",
              "Incendios / quemadas",
              "Inseguridad alimentaria",
              "Dengue / otras arbovirosis",
              "Calidad del aire / riesgo respiratorio",
              "Afectación de servicios de salud",
          ]

          def esperar_app(page, etiqueta):
              titulo = page.get_by_text("El Niño y salud pública en las Américas", exact=True)
              try:
                  titulo.wait_for(state="visible", timeout=20000)
              except Exception:
                  page.screenshot(path="filtros_exhaustivos_fallo.png", full_page=True)
                  print(open("/tmp/streamlit-filtros.log", encoding="utf-8", errors="replace").read()[-16000:])
                  raise AssertionError(f"La app quedó en blanco en: {etiqueta}")

              if page.locator('[data-testid="stException"]').count() > 0:
                  page.screenshot(path="filtros_exhaustivos_fallo.png", full_page=True)
                  textos = page.locator('[data-testid="stException"]').all_inner_texts()
                  raise AssertionError(f"Excepción visible en {etiqueta}: {textos}")

              if page.locator('[data-testid="stAppViewContainer"]').count() == 0:
                  page.screenshot(path="filtros_exhaustivos_fallo.png", full_page=True)
                  raise AssertionError(f"No existe AppViewContainer en: {etiqueta}")

              # El mapa debe volver a montarse después de cada rerun, incluso
              # cuando la combinación de filtros deje cero países.
              for _ in range(40):
                  for frame in page.frames:
                      if frame == page.main_frame:
                          continue
                      if frame.locator(".leaflet-container").count() > 0:
                          return
                  page.wait_for_timeout(250)

              page.screenshot(path="filtros_exhaustivos_fallo.png", full_page=True)
              raise AssertionError(f"El mapa no volvió a montarse en: {etiqueta}")

          def clear_multi(page, idx):
              for _ in range(20):
                  multis = page.locator('[data-testid="stMultiSelect"]')
                  if multis.count() <= idx:
                      raise AssertionError(f"No existe multiselect índice {idx}")
                  widget = multis.nth(idx)
                  chips = widget.locator('[data-testid="stMultiSelectDeleteIcon"]')
                  if chips.count() == 0:
                      return
                  chips.last.click()
                  page.wait_for_timeout(450)
              raise AssertionError(f"No fue posible limpiar multiselect {idx}")

          def select_multi(page, idx, value, clear_first=True):
              if clear_first:
                  clear_multi(page, idx)
              multis = page.locator('[data-testid="stMultiSelect"]')
              widget = multis.nth(idx)
              entrada = widget.locator("input")
              entrada.click()
              entrada.fill(value)
              page.wait_for_timeout(120)
              entrada.press("Enter")
              page.wait_for_timeout(120)

          def aplicar_consulta(page):
              page.locator('[data-testid="stFormSubmitButton"]').first.click()
              page.wait_for_timeout(850)

          def reset_consulta(page):
              # 0=subregión, 1=prioridad, 2=amenaza/impacto.
              for idx in (0, 1, 2):
                  clear_multi(page, idx)
              aplicar_consulta(page)
              esperar_app(page, "reset de filtros")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1100})
              page.goto("http://127.0.0.1:8502", wait_until="networkidle", timeout=120000)
              esperar_app(page, "carga inicial")

              pruebas = 0

              # El control duplicado del mapa debe haber desaparecido: solo
              # quedan los tres multiselect de consulta (subregión, prioridad,
              # amenaza/impacto).
              multis_iniciales = page.locator('[data-testid="stMultiSelect"]')
              if multis_iniciales.count() != 3:
                  page.screenshot(path="filtros_exhaustivos_fallo.png", full_page=True)
                  raise AssertionError(
                      f"Se esperaban 3 filtros multiselect y hay {multis_iniciales.count()}"
                  )
              if page.get_by_text("Seleccionar amenazas / impactos", exact=False).count() > 0:
                  raise AssertionError("Sigue visible el selector duplicado de amenazas del mapa")

              # Cada valor individual de cada filtro principal.
              for sub in SUBREGIONES:
                  reset_consulta(page)
                  select_multi(page, 0, sub)
                  aplicar_consulta(page)
                  esperar_app(page, f"Subregión={sub}")
                  pruebas += 1

              for pri in PRIORIDADES:
                  reset_consulta(page)
                  select_multi(page, 1, pri)
                  aplicar_consulta(page)
                  esperar_app(page, f"Prioridad={pri}")
                  pruebas += 1

              for amenaza in AMENAZAS:
                  reset_consulta(page)
                  select_multi(page, 2, amenaza)
                  aplicar_consulta(page)
                  esperar_app(page, f"Amenaza={amenaza}")
                  pruebas += 1

              # Todas las combinaciones Subregión × Prioridad.
              for sub, pri in product(SUBREGIONES, PRIORIDADES):
                  reset_consulta(page)
                  select_multi(page, 0, sub)
                  select_multi(page, 1, pri)
                  aplicar_consulta(page)
                  esperar_app(page, f"Subregión={sub} | Prioridad={pri}")
                  pruebas += 1

              # Todas las combinaciones Subregión × Amenaza.
              for sub, amenaza in product(SUBREGIONES, AMENAZAS):
                  reset_consulta(page)
                  select_multi(page, 0, sub)
                  select_multi(page, 2, amenaza)
                  aplicar_consulta(page)
                  esperar_app(page, f"Subregión={sub} | Amenaza={amenaza}")
                  pruebas += 1

              # Todas las combinaciones Prioridad × Amenaza.
              for pri, amenaza in product(PRIORIDADES, AMENAZAS):
                  reset_consulta(page)
                  select_multi(page, 1, pri)
                  select_multi(page, 2, amenaza)
                  aplicar_consulta(page)
                  esperar_app(page, f"Prioridad={pri} | Amenaza={amenaza}")
                  pruebas += 1

              # Estrés final: varios cambios rápidos consecutivos.
              reset_consulta(page)
              for sub in SUBREGIONES:
                  select_multi(page, 0, sub)
                  aplicar_consulta(page)
                  esperar_app(page, f"estrés subregión {sub}")
                  clear_multi(page, 0)
                  aplicar_consulta(page)
              for pri in PRIORIDADES:
                  select_multi(page, 1, pri)
                  aplicar_consulta(page)
                  esperar_app(page, f"estrés prioridad {pri}")
                  clear_multi(page, 1)
                  aplicar_consulta(page)

              print(f"OK filtros exhaustivos: {pruebas} escenarios validados")
              page.screenshot(path="filtros_exhaustivos_ok.png", full_page=True)
              browser.close()
          PY

      - name: E2E live Streamlit Cloud
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://elnino-ops.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1100})

              folium_frame = None
              last_error = None

              for intento in range(18):
                  try:
                      page.goto(URL, wait_until="domcontentloaded", timeout=120000)
                      page.wait_for_timeout(7000)

                      # Si Streamlit muestra una pantalla para despertar la app,
                      # intentar activarla automáticamente.
                      for texto in ["Yes, get this app back up!", "Wake up", "Get this app back up"]:
                          btn = page.get_by_text(texto, exact=False)
                          if btn.count() > 0:
                              try:
                                  btn.first.click(timeout=3000)
                                  page.wait_for_timeout(12000)
                              except Exception:
                                  pass

                      for frame in page.frames:
                          if frame == page.main_frame:
                              continue
                          if frame.locator("path.leaflet-interactive").count() > 0:
                              folium_frame = frame
                              break

                      if folium_frame:
                          break
                  except Exception as exc:
                      last_error = exc

                  page.wait_for_timeout(8000)

              if folium_frame is None:
                  page.screenshot(path="mapa_live_fallo.png", full_page=True)
                  raise AssertionError(f"La versión live aún no muestra Folium. Último error: {last_error}")

              pais = folium_frame.locator("path.leaflet-interactive").first
              pais.hover(force=True)
              tooltip = folium_frame.locator(".leaflet-tooltip").first
              tooltip.wait_for(state="visible", timeout=15000)
              texto = tooltip.inner_text()

              if "Prioridad" not in texto or "Amenazas / impactos" not in texto:
                  page.screenshot(path="mapa_live_fallo.png", full_page=True)
                  raise AssertionError(f"Tooltip live incompleto: {texto!r}")
              if "Situación" in texto:
                  page.screenshot(path="mapa_live_fallo.png", full_page=True)
                  raise AssertionError(f"El popup live todavía muestra Situación: {texto!r}")

              pais.click(force=True)
              foco = pais.evaluate("""el => ({
                  outlineStyle: getComputedStyle(el).outlineStyle,
                  outlineWidth: getComputedStyle(el).outlineWidth,
                  boxShadow: getComputedStyle(el).boxShadow,
                  active: document.activeElement === el
              })""")
              if foco["outlineStyle"] != "none" or foco["boxShadow"] not in ("none", ""):
                  page.screenshot(path="mapa_live_click_fallo.png", full_page=True)
                  raise AssertionError(f"El clic live todavía deja foco visual: {foco}")

              limites_navegacion = folium_frame.evaluate("""() => {
                  const key = Object.keys(window).find(k => k.startsWith('map_') && window[k] && window[k].getBounds);
                  if (!key) return null;
                  const mb = window[key].options.maxBounds;
                  if (!mb) return null;
                  return {
                      south: mb.getSouth(), west: mb.getWest(),
                      north: mb.getNorth(), east: mb.getEast()
                  };
              }""")
              if not limites_navegacion or limites_navegacion["north"] < 80:
                  page.screenshot(path="mapa_live_fallo.png", full_page=True)
                  raise AssertionError(f"La versión live sigue limitada antes de Canadá: {limites_navegacion}")

              print("OK LIVE tooltip:", texto[:300])
              print("OK LIVE navegación Canadá:", limites_navegacion)
              page.screenshot(path="mapa_live_ok.png", full_page=True)
              browser.close()
          PY

