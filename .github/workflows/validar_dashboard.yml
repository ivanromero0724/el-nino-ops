name: Validar dashboard

# Validación automática del dashboard, dependencias, geografía y capas cartográficas.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "app.py"
      - ".streamlit/**"
      - "requirements.txt"
      - "data/base_maestra_elnino.csv"
      - "data/geografia/paises_americas.gpkg"
      - "assets/ops_oms.png"
      - ".github/workflows/validar_dashboard.yml"

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Aplicar mapa interactivo de amenazas
        if: ${{ hashFiles('scripts/patch_dashboard_mapa_interactivo.py') != '' }}
        run: python scripts/patch_dashboard_mapa_interactivo.py

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis
        run: python -m py_compile app.py

      - name: Validar carga del dashboard
        run: python -c "import app"

      - name: Guardar mapa interactivo validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes en app.py"
          else
            git commit -m "Hacer interactivo el mapa de prioridad y amenazas con popups"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
