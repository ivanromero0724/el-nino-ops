name: Validar app Folium

on:
  push:
    paths:
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/validar_app_folium.yml"

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis
        run: |
          python -m py_compile app.py app_legacy.py

      - name: Validar componentes del mapa
        run: |
          python - <<'PY'
          from pathlib import Path
          txt = Path("app.py").read_text(encoding="utf-8")
          requeridos = [
              "def _construir_folium",
              "folium.GeoJsonTooltip",
              "tooltip=folium.GeoJsonTooltip",
              "zoom_start=3.0",
              "clip_americas = box(-135.0",
              "st_folium(",
              "use_container_width=True",
          ]
          faltan = [x for x in requeridos if x not in txt]
          if faltan:
              raise SystemExit(f"Faltan componentes del mapa: {faltan}")
          print("OK: estructura Folium y hover presentes")
          PY

      - name: Smoke test del mapa real
        env:
          OPS_MAP_SMOKE_TEST: "1"
        run: |
          python - <<'PY'
          import pandas as pd
          import geopandas as gpd
          from shapely.geometry import Polygon
          import app

          geo = gpd.GeoDataFrame(
              {
                  "COUNTRY": ["Mexico"],
                  "ISO_CC": ["MEX"],
              },
              geometry=[Polygon([(-118,14),(-86,14),(-86,33),(-118,33),(-118,14)])],
              crs="EPSG:4326",
          )
          actual = pd.DataFrame([{
              "iso3": "MEX",
              "pais": "México",
              "prioridad": "Alta",
              "situacion_predominante": "Déficit de precipitación e incremento del riesgo de incendios.",
              "icono_agua": 1,
              "icono_inundaciones": 0,
              "icono_incendios": 1,
              "icono_alimentos": 0,
              "icono_arbovirosis": 0,
              "icono_respiratorio": 0,
              "icono_servicios": 0,
          }])
          frame = {
              "geo": geo,
              "actual": actual,
              "filtrado": actual.copy(),
              "hay_filtros": False,
              "amenazas_mapa": list(app.AMENAZAS.keys()),
              "AMENAZAS_CORTAS": {
                  "Sequía / agua": "Sequía",
                  "Inundaciones / lluvias": "Inundaciones",
                  "Incendios / quemadas": "Incendios",
                  "Inseguridad alimentaria": "Inseguridad alimentaria",
                  "Dengue / otras arbovirosis": "Arbovirosis",
                  "Calidad del aire / riesgo respiratorio": "Aire",
                  "Afectación de servicios de salud": "Afectación servicios",
              },
          }

          m = app._construir_folium(frame)
          rendered = m.get_root().render()

          checks = {
              "hover Leaflet": "bindTooltip" in rendered,
              "campo país": "pais_popup" in rendered,
              "campo prioridad": "prioridad_popup" in rendered,
              "campo amenazas": "amenazas_popup" in rendered,
              "situación fuera del popup": "situacion_popup" not in rendered,
              "vista centrada": "zoom_start=3.0" in __import__("pathlib").Path("app.py").read_text(encoding="utf-8"),
              "callout": "#075594" in rendered,
          }
          fallos = [k for k, ok in checks.items() if not ok]
          if fallos:
              raise SystemExit(f"Falló smoke test del mapa: {fallos}")
          print("OK:", checks)
          PY

      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: E2E hover en navegador
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          trap "kill $APP_PID || true" EXIT

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8501/_stcore/health

          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1100})
              page.goto("http://127.0.0.1:8501", wait_until="networkidle", timeout=120000)

              # Esperar a que el componente Folium esté montado.
              folium_frame = None
              for _ in range(60):
                  for frame in page.frames:
                      if frame == page.main_frame:
                          continue
                      if frame.locator("path.leaflet-interactive").count() > 0:
                          folium_frame = frame
                          break
                  if folium_frame:
                      break
                  page.wait_for_timeout(1000)

              if folium_frame is None:
                  page.screenshot(path="mapa_hover_fallo.png", full_page=True)
                  raise AssertionError("No se encontró el mapa Leaflet interactivo")

              pais = folium_frame.locator("path.leaflet-interactive").first
              pais.hover(force=True)
              tooltip = folium_frame.locator(".leaflet-tooltip").first
              tooltip.wait_for(state="visible", timeout=10000)
              texto = tooltip.inner_text()

              if "Prioridad" not in texto or "Amenazas / impactos" not in texto:
                  page.screenshot(path="mapa_hover_fallo.png", full_page=True)
                  raise AssertionError(f"Tooltip incompleto: {texto!r}")
              if "Situación" in texto:
                  page.screenshot(path="mapa_hover_fallo.png", full_page=True)
                  raise AssertionError(f"El popup todavía muestra Situación: {texto!r}")

              # Al hacer clic en un país no debe aparecer el rectángulo azul
              # de foco del SVG ni quedar el polígono enfocado.
              pais.click(force=True)
              foco = pais.evaluate("""el => ({
                  outlineStyle: getComputedStyle(el).outlineStyle,
                  outlineWidth: getComputedStyle(el).outlineWidth,
                  boxShadow: getComputedStyle(el).boxShadow,
                  active: document.activeElement === el
              })""")
              if foco["outlineStyle"] != "none" or foco["boxShadow"] not in ("none", ""):
                  page.screenshot(path="mapa_click_fallo.png", full_page=True)
                  raise AssertionError(f"El clic todavía deja foco visual: {foco}")

              # Verificar que el encuadre visible contiene México y el extremo sur
              # de Sudamérica. Se toma la instancia Leaflet creada por Folium.
              bounds = folium_frame.evaluate("""() => {
                  const key = Object.keys(window).find(k => k.startsWith('map_') && window[k] && window[k].getBounds);
                  if (!key) return null;
                  const b = window[key].getBounds();
                  return {
                      south: b.getSouth(), west: b.getWest(),
                      north: b.getNorth(), east: b.getEast()
                  };
              }""")
              if not bounds:
                  raise AssertionError("No se pudieron leer los límites del mapa Leaflet")

              centro = folium_frame.evaluate("""() => {
                  const key = Object.keys(window).find(k => k.startsWith('map_') && window[k] && window[k].getCenter);
                  if (!key) return null;
                  const c = window[key].getCenter();
                  return {lat: c.lat, lng: c.lng};
              }""")
              if not centro or not (-80 <= centro["lng"] <= -72):
                  page.screenshot(path="mapa_centrado_fallo.png", full_page=True)
                  raise AssertionError(f"El mapa no quedó centrado sobre América: {centro}")

              solapes = folium_frame.evaluate("""() => {
                  const els = [...document.querySelectorAll('.ops-callout')];
                  const cajas = els.map(el => {
                      const r = el.getBoundingClientRect();
                      return {iso: el.dataset.iso || '', x:r.x, y:r.y, w:r.width, h:r.height};
                  });
                  const out = [];
                  for (let i=0; i<cajas.length; i++) {
                      for (let j=i+1; j<cajas.length; j++) {
                          const a=cajas[i], b=cajas[j];
                          const ix = Math.max(0, Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x));
                          const iy = Math.max(0, Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
                          if (ix > 2 && iy > 2) out.push({a:a.iso,b:b.iso,ix,iy});
                      }
                  }
                  return out;
              }""")
              if solapes:
                  page.screenshot(path="mapa_solapes_fallo.png", full_page=True)
                  raise AssertionError(f"Callouts superpuestos: {solapes}")
              if not (bounds["south"] <= -55 and bounds["north"] >= 31 and bounds["west"] <= -116 and bounds["east"] >= -36):
                  page.screenshot(path="mapa_hover_fallo.png", full_page=True)
                  raise AssertionError(f"Encuadre incompleto México-Sudamérica: {bounds}")
              centro_live = folium_frame.evaluate("""() => {
                  const key = Object.keys(window).find(k => k.startsWith('map_') && window[k] && window[k].getCenter);
                  if (!key) return null;
                  const c = window[key].getCenter();
                  return {lat: c.lat, lng: c.lng};
              }""")
              if not centro_live or not (-80 <= centro_live["lng"] <= -72):
                  page.screenshot(path="mapa_live_centrado_fallo.png", full_page=True)
                  raise AssertionError(f"La versión live no quedó centrada: {centro_live}")

              solapes_live = folium_frame.evaluate("""() => {
                  const els = [...document.querySelectorAll('.ops-callout')];
                  const cajas = els.map(el => {
                      const r = el.getBoundingClientRect();
                      return {iso: el.dataset.iso || '', x:r.x, y:r.y, w:r.width, h:r.height};
                  });
                  const out = [];
                  for (let i=0; i<cajas.length; i++) {
                      for (let j=i+1; j<cajas.length; j++) {
                          const a=cajas[i], b=cajas[j];
                          const ix = Math.max(0, Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x));
                          const iy = Math.max(0, Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
                          if (ix > 2 && iy > 2) out.push({a:a.iso,b:b.iso,ix,iy});
                      }
                  }
                  return out;
              }""")
              if solapes_live:
                  page.screenshot(path="mapa_live_solapes_fallo.png", full_page=True)
                  raise AssertionError(f"Callouts live superpuestos: {solapes_live}")

              limites_navegacion = folium_frame.evaluate("""() => {
                  const key = Object.keys(window).find(k => k.startsWith('map_') && window[k] && window[k].getBounds);
                  if (!key) return null;
                  const mb = window[key].options.maxBounds;
                  if (!mb) return null;
                  return {
                      south: mb.getSouth(), west: mb.getWest(),
                      north: mb.getNorth(), east: mb.getEast()
                  };
              }""")
              if not limites_navegacion:
                  raise AssertionError("No se pudieron leer los límites de navegación")
              if limites_navegacion["north"] < 80:
                  page.screenshot(path="mapa_hover_fallo.png", full_page=True)
                  raise AssertionError(f"Canadá sigue limitado: {limites_navegacion}")

              # Estrés de reruns: aplicar varios filtros seguidos y comprobar
              # que la app no quede en blanco durante las reconstrucciones.
              for valor in ["Alta", "Media", "Baja"]:
                  multis = page.locator('[data-testid="stMultiSelect"]')
                  if multis.count() < 3:
                      page.screenshot(path="filtros_rerun_fallo.png", full_page=True)
                      raise AssertionError("No se encontraron los filtros multiselect esperados")
                  prioridad = multis.nth(1)
                  entrada = prioridad.locator("input")
                  entrada.click()
                  entrada.fill(valor)
                  page.wait_for_timeout(250)
                  entrada.press("Enter")
                  page.wait_for_timeout(1200)

                  titulo = page.get_by_text("El Niño y salud pública en las Américas", exact=True)
                  titulo.wait_for(state="visible", timeout=15000)
                  if page.locator('[data-testid="stAppViewContainer"]').count() == 0:
                      page.screenshot(path="filtros_rerun_fallo.png", full_page=True)
                      raise AssertionError(f"La app quedó en blanco al aplicar prioridad {valor}")

              # Después de varios reruns, el mapa debe volver a montarse.
              folium_ok = False
              for _ in range(30):
                  for frame in page.frames:
                      if frame == page.main_frame:
                          continue
                      if frame.locator("path.leaflet-interactive").count() > 0:
                          folium_ok = True
                          break
                  if folium_ok:
                      break
                  page.wait_for_timeout(500)
              if not folium_ok:
                  page.screenshot(path="filtros_rerun_fallo.png", full_page=True)
                  raise AssertionError("El mapa no volvió a montarse después de varios filtros")

              print("OK tooltip navegador:", texto[:300])
              print("OK bounds:", bounds)
              print("OK navegación Canadá:", limites_navegacion)
              print("OK reruns por filtros")
              page.screenshot(path="mapa_hover_ok.png", full_page=True)
              browser.close()
          PY

      - name: E2E live Streamlit Cloud
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://elnino-ops.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1100})

              folium_frame = None
              last_error = None

              for intento in range(18):
                  try:
                      page.goto(URL, wait_until="domcontentloaded", timeout=120000)
                      page.wait_for_timeout(7000)

                      # Si Streamlit muestra una pantalla para despertar la app,
                      # intentar activarla automáticamente.
                      for texto in ["Yes, get this app back up!", "Wake up", "Get this app back up"]:
                          btn = page.get_by_text(texto, exact=False)
                          if btn.count() > 0:
                              try:
                                  btn.first.click(timeout=3000)
                                  page.wait_for_timeout(12000)
                              except Exception:
                                  pass

                      for frame in page.frames:
                          if frame == page.main_frame:
                              continue
                          if frame.locator("path.leaflet-interactive").count() > 0:
                              folium_frame = frame
                              break

                      if folium_frame:
                          break
                  except Exception as exc:
                      last_error = exc

                  page.wait_for_timeout(8000)

              if folium_frame is None:
                  page.screenshot(path="mapa_live_fallo.png", full_page=True)
                  raise AssertionError(f"La versión live aún no muestra Folium. Último error: {last_error}")

              pais = folium_frame.locator("path.leaflet-interactive").first
              pais.hover(force=True)
              tooltip = folium_frame.locator(".leaflet-tooltip").first
              tooltip.wait_for(state="visible", timeout=15000)
              texto = tooltip.inner_text()

              if "Prioridad" not in texto or "Amenazas / impactos" not in texto:
                  page.screenshot(path="mapa_live_fallo.png", full_page=True)
                  raise AssertionError(f"Tooltip live incompleto: {texto!r}")
              if "Situación" in texto:
                  page.screenshot(path="mapa_live_fallo.png", full_page=True)
                  raise AssertionError(f"El popup live todavía muestra Situación: {texto!r}")

              pais.click(force=True)
              foco = pais.evaluate("""el => ({
                  outlineStyle: getComputedStyle(el).outlineStyle,
                  outlineWidth: getComputedStyle(el).outlineWidth,
                  boxShadow: getComputedStyle(el).boxShadow,
                  active: document.activeElement === el
              })""")
              if foco["outlineStyle"] != "none" or foco["boxShadow"] not in ("none", ""):
                  page.screenshot(path="mapa_live_click_fallo.png", full_page=True)
                  raise AssertionError(f"El clic live todavía deja foco visual: {foco}")

              limites_navegacion = folium_frame.evaluate("""() => {
                  const key = Object.keys(window).find(k => k.startsWith('map_') && window[k] && window[k].getBounds);
                  if (!key) return null;
                  const mb = window[key].options.maxBounds;
                  if (!mb) return null;
                  return {
                      south: mb.getSouth(), west: mb.getWest(),
                      north: mb.getNorth(), east: mb.getEast()
                  };
              }""")
              if not limites_navegacion or limites_navegacion["north"] < 80:
                  page.screenshot(path="mapa_live_fallo.png", full_page=True)
                  raise AssertionError(f"La versión live sigue limitada antes de Canadá: {limites_navegacion}")

              print("OK LIVE tooltip:", texto[:300])
              print("OK LIVE navegación Canadá:", limites_navegacion)
              page.screenshot(path="mapa_live_ok.png", full_page=True)
              browser.close()
          PY

      - name: Guardar captura E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapa-hover-e2e
          path: |
            mapa_hover_ok.png
            mapa_hover_fallo.png
            mapa_click_fallo.png
            mapa_centrado_fallo.png
            mapa_solapes_fallo.png
            mapa_live_ok.png
            mapa_live_fallo.png
            mapa_live_click_fallo.png
            mapa_live_centrado_fallo.png
            mapa_live_solapes_fallo.png
            filtros_rerun_fallo.png
          if-no-files-found: ignore
