name: Validar app Folium

on:
  push:
    paths:
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/validar_app_folium.yml"

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis
        run: |
          python -m py_compile app.py app_legacy.py

      - name: Validar componentes del mapa
        run: |
          python - <<'PY'
          from pathlib import Path
          txt = Path("app.py").read_text(encoding="utf-8")
          requeridos = [
              "def _construir_folium",
              "folium.GeoJsonTooltip",
              "tooltip=folium.GeoJsonTooltip",
              "m.fit_bounds",
              "st_folium(",
              "use_container_width=True",
          ]
          faltan = [x for x in requeridos if x not in txt]
          if faltan:
              raise SystemExit(f"Faltan componentes del mapa: {faltan}")
          print("OK: estructura Folium y hover presentes")
          PY

      - name: Smoke test de Folium tooltip
        run: |
          python - <<'PY'
          import folium
          from folium.features import GeoJsonTooltip

          geo = {
              "type": "FeatureCollection",
              "features": [{
                  "type": "Feature",
                  "properties": {
                      "pais_popup": "México",
                      "prioridad_popup": "Alta",
                      "amenazas_popup": "Sequía",
                      "situacion_popup": "Prueba",
                      "fill_hex": "#D71920",
                  },
                  "geometry": {
                      "type": "Polygon",
                      "coordinates": [[[-100,20],[-99,20],[-99,21],[-100,21],[-100,20]]],
                  },
              }],
          }

          m = folium.Map(location=[20.5,-99.5], zoom_start=5, tiles=None)
          folium.GeoJson(
              geo,
              style_function=lambda feat: {
                  "fillColor": feat["properties"]["fill_hex"],
                  "color": "#FFFFFF",
                  "weight": 1,
                  "fillOpacity": 1,
              },
              tooltip=GeoJsonTooltip(
                  fields=["pais_popup","prioridad_popup","amenazas_popup","situacion_popup"],
                  aliases=["País:","Prioridad:","Amenazas / impactos:","Situación:"],
                  sticky=True,
              ),
          ).add_to(m)
          html = m.get_root().render()
          assert "bindTooltip" in html
          assert "pais_popup" in html
          assert "México" in html
          print("OK: Leaflet genera tooltip hover correctamente")
          PY
