name: Ajustar alineación situación regional

on:
  push:
    paths:
      - ".github/workflows/ajustar_alineacion_situacion.yml"

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Alinear gráficos de situación regional
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("app.py")
          txt = p.read_text(encoding="utf-8")

          cambios = {
              "def grafico_subregion(datos):": "def grafico_subregion(datos, altura=560):",
              "        height=max(320, 56 * max(1, len(orden_sub)) + 125),": "        height=altura,",
              "def matriz_amenazas(datos):": "def matriz_amenazas(datos, altura=560):",
              "        height=max(350, 25 * len(m) + 90),": "        height=altura,",
          }
          for old, new in cambios.items():
              if old not in txt:
                  raise RuntimeError(f"No se encontró el texto esperado: {old}")
              txt = txt.replace(old, new, 1)

          bloque_old = '''# Situación regional
          section_header("Situación regional", "Comparación territorial y perfil de amenazas")
          g1, g2 = st.columns([1.0, 1.45], gap="medium")
          with g1:
              with st.container(border=True):
                  st.markdown("**Prioridad por subregión**")
                  st.plotly_chart(grafico_subregion(filtrado), use_container_width=True, config=CHART_CONFIG)
          with g2:
              with st.container(border=True):
                  st.markdown("**País × amenaza / impacto**")
                  st.plotly_chart(matriz_amenazas(filtrado), use_container_width=True, config=CHART_CONFIG)
          '''

          bloque_new = '''# Situación regional
          section_header("Situación regional", "Comparación territorial y perfil de amenazas")
          # Los dos gráficos usan exactamente la misma altura para que sus tarjetas
          # comiencen y terminen alineadas. La altura se adapta al número de países
          # visibles, pero se limita para evitar paneles demasiado altos o bajos.
          altura_situacion = max(520, min(620, 25 * max(1, len(filtrado)) + 90))
          g1, g2 = st.columns([1.0, 1.45], gap="medium")
          with g1:
              with st.container(border=True):
                  st.markdown("**Prioridad por subregión**")
                  st.plotly_chart(
                      grafico_subregion(filtrado, altura=altura_situacion),
                      use_container_width=True,
                      config=CHART_CONFIG,
                  )
          with g2:
              with st.container(border=True):
                  st.markdown("**País × amenaza / impacto**")
                  st.plotly_chart(
                      matriz_amenazas(filtrado, altura=altura_situacion),
                      use_container_width=True,
                      config=CHART_CONFIG,
                  )
          '''

          if bloque_old not in txt:
              raise RuntimeError("No se encontró el bloque de Situación regional esperado")
          txt = txt.replace(bloque_old, bloque_new, 1)
          p.write_text(txt, encoding="utf-8")
          print("Situación regional alineada con altura compartida")
          PY

      - name: Guardar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Alinear gráficos de situación regional"
            git push
          fi
